[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uuma"
version = "0.0.1"
description = "Compositional PoW research prototype (not a universal miner)"
requires-python = ">=3.10"
dependencies = [
    "bip-utils==2.9.3",
    "ecdsa==0.19.2",
    "pycryptodome==3.20.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
